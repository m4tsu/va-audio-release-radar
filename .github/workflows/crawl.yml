name: 声優起点のクロール (手動実行)

# 声優ごとに DLsite / Audible / ポケットドラマ CD を巡回し、本番の POST /api/admin/ingest に投げる。
# クローラーを Worker 内で動かさないのは Cloudflare からの egress とサブリクエスト上限を避けるため
# (docs/architecture.md)。必要な Secrets は INGEST_URL と INGEST_TOKEN。
#
# **定期実行は止めてある。手動実行だけができる。** 声優起点で対象声優の全員を回すと
# ジョブ時間の上限を超え、その間ずっと相手サイトを叩き続けるため。日次はストアの新着一覧に
# 切り替えると決まっている (docs/decisions/0007-daily-crawl-from-store-feeds.md)。
# 定期実行を戻すのは、この走行が「月次の補完巡回」か「シーズンごとの新規声優」に
# 絞られ、対象の人数がジョブ時間に収まると分かったとき
on:
  workflow_dispatch:
    inputs:
      only:
        description: "対象の声優 (canonicalName か slug をカンマ区切り。空なら全員)"
        required: false
        type: string
      store:
        # ポケドラは声優タグ辞書 (crawler/pokedora-tags.generated.json) を見て引く。
        # 辞書に無い声優は引かない
        description: "対象ストア (all なら 3 ストアすべて)"
        required: false
        type: choice
        default: all
        options:
          - all
          - dlsite
          - audible
          - pokedora

# 前回の実行が終わる前に次を始めない。
# 同じストアへ二重にアクセスすると、プロセスをまたぐレート制限が効かないため
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    name: ストアを巡回して取り込む
    runs-on: ubuntu-latest
    # 所要は 声優の人数 × ストアごとの往復数 × ホストごとの間隔 で決まる (crawler/lib/fetch.ts)。
    # 往復は 1 ストア 1 回とは限らない。DLsite は引くフロアの数だけ増える
    # (docs/decisions/0011-dlsite-garumani-floor.md)。
    #
    # **この上限に収まる人数の目安は 230 人** (3 ストアすべてを引く場合)。
    # 1 人あたり DLsite 2 フロア + Audible 1 回 + ポケドラ 1 回で、間隔の合計が約 31 秒。
    # 120 分 ÷ 31 秒 ≒ 230 人。--store で 1 つに絞れば DLsite で 360 人、Audible で 1,200 人。
    # 間隔は docs/stores/ の各ファイルの「レート間隔」。上の only で対象を絞って使う前提の値。
    # 対象の全員を回すもの (月次) は monthly-backfill.yml が声優 ID で組に分けて回す
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: クロールと取り込み
        # 入力と秘匿値は env 経由で渡す。run 本文に ${{ }} で埋め込むと、入力の中身が
        # シェルとして解釈されてしまうため
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          ONLY: ${{ inputs.only }}
          STORE: ${{ inputs.store }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ -n "$STORE" ] && [ "$STORE" != all ]; then args+=(--store "$STORE"); fi
          node crawler/run.ts --base-url "$INGEST_URL" "${args[@]}"
      - name: 取得した生データを残す
        # パーサーが壊れたときに再現できるよう、失敗しても必ず上げる
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: snapshots
          path: crawler/.cache/snapshots
          retention-days: 7
          if-no-files-found: ignore
