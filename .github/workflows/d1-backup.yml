name: 本番 D1 のバックアップ

# 本番 D1 の中身を週に 1 回書き出して artifact に残す。理由、必要な Secrets、復元の手順は README の「本番 D1」。
# スキーマは書き出さない (復元先にはマイグレーションで当てる)
on:
  schedule:
    - cron: "0 19 * * 6" # 毎週日曜 04:00 JST (cron は UTC なので土曜 19:00)
  workflow_dispatch:

jobs:
  backup:
    name: 本番 D1 を書き出す
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 書き出し
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export DB --remote --no-schema --output d1-backup.sql -y
      - name: 中身の確認
        # 空のファイルを控えとして残さない。本番が空なら失敗させ、控えが無いことに気づけるようにする
        run: test -s d1-backup.sql && grep -c "INSERT INTO" d1-backup.sql
      - uses: actions/upload-artifact@v5
        with:
          name: d1-backup-${{ github.run_id }}
          path: d1-backup.sql
          # 90 日ぶんが private リポジトリの artifact 容量に収まることを、実行ログのファイルサイズで
          # 確かめる。超えるなら日数を縮める
          retention-days: 90
          if-no-files-found: error
