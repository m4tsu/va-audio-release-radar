name: 本番 D1 のバックアップ

# 本番 D1 の中身を週に 1 回書き出して artifact に残す。
# D1 の Time Travel は Workers Free プランでは 7 日しか遡れないので、これが唯一の長期の控えになる
# (README の「本番 D1」)。必要な Secrets は CLOUDFLARE_API_TOKEN (D1 の編集権限だけ) と CLOUDFLARE_ACCOUNT_ID。
# 復元は `npm run db:restore:local` (手元) か、`wrangler d1 execute DB --remote --file` (本番)
on:
  schedule:
    - cron: "0 19 * * 0" # 毎週日曜 04:00 JST
  workflow_dispatch:

jobs:
  backup:
    name: 本番 D1 を書き出す
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 書き出し
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export DB --remote --output d1-backup.sql -y
      - name: 中身の確認
        # 空のファイルを控えとして残さない
        run: test -s d1-backup.sql && grep -c "INSERT INTO" d1-backup.sql
      - uses: actions/upload-artifact@v5
        with:
          name: d1-backup-${{ github.run_id }}
          path: d1-backup.sql
          # private リポジトリの artifact 容量は 500 MB。1 回数 MB なので 90 日ぶんでも収まる
          retention-days: 90
          if-no-files-found: error
