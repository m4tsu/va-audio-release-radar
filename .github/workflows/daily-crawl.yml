name: 日次のクロール (新着一覧)

# ストアの新着一覧を引き、まだ知らない作品だけを本番の POST /api/admin/ingest に投げる
# (docs/decisions/0007-daily-crawl-from-store-feeds.md)。必要な Secrets は INGEST_URL と INGEST_TOKEN。
#
# 声優起点の巡回 (crawl.yml) と分けてあるのは、走る周期も所要も違うため。
# あちらは対象声優の人数に比例して数時間かかり、手動実行だけにしてある。
on:
  schedule:
    # 04:10 UTC = 13:10 JST。新着一覧の 1 ページ目が数日ぶんを覆うので時刻の精度は要らない
    # (docs/research/new-release-feeds-2026-09-19.md)。正時を外すのは GitHub Actions の混雑を避けるため
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      store:
        description: "対象ストア (空なら新着一覧を持つストアすべて)"
        required: false
        type: choice
        options:
          - ""
          - dlsite
          - audible
          - pokedora

# 声優起点の巡回と同じグループにする。レートリミッタはプロセス内にあるので、
# 2 つの走行が重なると同じホストへの実効間隔が半分になる (crawler/lib/fetch.ts)
concurrency:
  group: crawl
  cancel-in-progress: false

# 失敗を Issue に書くのに要る。読み取りは checkout のぶん
permissions:
  contents: read
  issues: write

jobs:
  daily:
    name: 新着一覧から取り込む
    runs-on: ubuntu-latest
    # ストアごとに 新着一覧 1 ページ × 入口の数 + 「一覧に出たが DB に無い作品」の詳細。
    # 後者は新作の数とは違う。対象声優が居ない作品は保存されないので DB に入らず、
    # 一覧から消えるまで毎日引き直す (docs/stores/dlsite.md と docs/stores/pokedora.md の
    # 「ストア全体の新着一覧」/「新着一覧 (キーワード無し)」)。
    # 入口の数はストアで違う。DLsite は 2 フロア、ポケドラは 2 区分、
    # Audible は robots が許可する並び順違いの 8 本。
    # Audible だけは一覧に出演者が載るので詳細を引かず、往復が 8 で一定になる。
    # 1 回ぶんの実測は docs/research/dlsite-daily-feed-2026-09-21.md と
    # docs/research/audible-daily-feed-2026-09-21.md。
    # 上限はストアが増えたときの歯止めとして置いている
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 新着一覧のクロールと取り込み
        # 入力と秘匿値は env 経由で渡す。run 本文に ${{ }} で埋め込むと、入力の中身が
        # シェルとして解釈されてしまうため
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          STORE: ${{ inputs.store }}
        run: |
          args=()
          if [ -n "$STORE" ]; then args+=(--store "$STORE"); fi
          node crawler/daily.ts --base-url "$INGEST_URL" "${args[@]}"
      - name: 取得した生データを残す
        # パーサーが壊れたときに再現できるよう、失敗しても必ず上げる
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: snapshots
          path: crawler/.cache/snapshots
          retention-days: 7
          if-no-files-found: ignore
      - name: 失敗を Issue に出す
        # 失敗しても GitHub は黙っているので、人が見る場所に出す。
        # cron が起動しなかった場合はここも動かないので、外形監視と両方が要る
        # (README.md の「外形監視」)。
        # cancelled() を入れるのは timeout-minutes で打ち切られた走行を拾うため
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # ラベルが無いと gh issue create が落ちる。--force は既にあっても失敗しない
          gh label create crawl-failure --color b60205 --description "日次のクロールが失敗した" --force
          # 同じ理由の Issue を毎日増やさない。開いているものがあれば追記だけする
          existing="$(gh issue list --label crawl-failure --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "日次のクロールがまた失敗した: $RUN_URL"
          else
            gh issue create \
              --title "日次のクロールが失敗した" \
              --label crawl-failure \
              --body "$(printf '%s\n\n%s\n' "走行のログ: $RUN_URL" "直ったらこの Issue を閉じる。閉じないと次の失敗が追記になって気づきにくい。")"
          fi
