name: 月次の補完巡回

# 作品を持つ声優を声優起点で引き直し、日次の新着一覧が取りこぼした作品を埋める。
# DLsite は既知作品の詳細も取り直して、販売終了になった作品を取り下げる
# (docs/decisions/0007-daily-crawl-from-store-feeds.md、
#  docs/decisions/0008-no-price-no-availability.md)。
# 必要な Secrets は INGEST_URL と INGEST_TOKEN (日次・週次と同じもの)。
on:
  schedule:
    # 毎月 1 日 18:10 UTC = 2 日 03:10 JST。日次 (04:10 UTC) とも週次 (月曜 20:20 UTC) とも
    # 重ならない時刻にする。月 1 回なので時刻の精度は要らない
    - cron: "10 18 1 * *"
  workflow_dispatch:
    inputs:
      store:
        description: "対象ストア (空なら 3 ストアすべて)"
        required: false
        type: choice
        options:
          - ""
          - dlsite
          - audible
          - pokedora

# 日次・週次・手動の巡回と同じグループにする。レートリミッタはプロセス内にあるので、
# 2 つの走行が重なると同じホストへの実効間隔が半分になる (crawler/lib/fetch.ts)
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # DLsite だけ人数で分ける。1 ジョブがジョブ時間の上限に収まらないため。
  # 2026-09-23 時点で作品を持つ声優は 1,161 人、DLsite の listing は 992 件。
  # 検索 1,161 人 × 2 フロア + 詳細 992 件 = 3,314 往復 × 10 秒 = 約 9.2 時間。
  # 3 つに割ると 1 つあたり 3 時間強になる。フロアの数と間隔は docs/stores/dlsite.md
  dlsite:
    name: DLsite を引き直す (${{ matrix.shard.name }})
    if: ${{ inputs.store == '' || inputs.store == 'dlsite' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      # 並べて走らせない。同じホストを 2 つのプロセスから叩くと、
      # プロセス内のレートリミッタが意味を為さなくなる
      max-parallel: 1
      fail-fast: false
      matrix:
        shard:
          - { name: "1/3", offset: 0, limit: 400 }
          - { name: "2/3", offset: 400, limit: 400 }
          - { name: "3/3", offset: 800, limit: 400 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 引き直しと取り下げ
        # --no-skip-known を付けるのは、既知作品の詳細を取り直さないと
        # 販売終了に気づけないため。日次は新規作品の詳細しか引かない
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          OFFSET: ${{ matrix.shard.offset }}
          LIMIT: ${{ matrix.shard.limit }}
        run: |
          node crawler/run.ts --base-url "$INGEST_URL" \
            --store dlsite --with-works --no-skip-known --no-snapshot \
            --offset "$OFFSET" --limit "$LIMIT"

  # DLsite 以外は 1 ジョブに収まる。取り下げを読めるのは DLsite だけなので
  # (docs/stores/ の各ファイル)、詳細の取り直しもしない
  others:
    name: ${{ matrix.store }} を引き直す
    if: ${{ inputs.store == '' || inputs.store == 'audible' || inputs.store == 'pokedora' }}
    runs-on: ubuntu-latest
    # 1,161 人 × 1 回 × 6 秒 (Audible) で約 2 時間。ポケドラは辞書に載る人だけなので短い
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        store: [audible, pokedora]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 引き直し
        if: ${{ inputs.store == '' || inputs.store == matrix.store }}
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          STORE: ${{ matrix.store }}
        run: |
          node crawler/run.ts --base-url "$INGEST_URL" \
            --store "$STORE" --with-works --no-snapshot

  失敗を知らせる:
    name: 失敗を Issue に出す
    needs: [dlsite, others]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      # 失敗しても GitHub は黙っているので、人が見る場所に出す
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create crawl-failure --color b60205 --description "日次のクロールが失敗した" --force
          existing="$(gh issue list --label crawl-failure --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "月次の補完巡回が失敗した: $RUN_URL"
          else
            gh issue create \
              --title "月次の補完巡回が失敗した" \
              --label crawl-failure \
              --body "$(printf '%s\n\n%s\n' "走行のログ: $RUN_URL" "直ったらこの Issue を閉じる。閉じないと次の失敗が追記になって気づきにくい。")"
          fi
