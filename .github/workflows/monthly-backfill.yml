name: 月次の補完巡回

# 2 つのことをする。
#   1. 作品を持つ声優を声優起点で引き直し、日次の新着一覧が取りこぼした作品を埋める
#   2. 台帳にある DLsite の作品を引き直し、もう買えないものを取り下げる
#
# 2 を声優起点でやらない理由がある。ストアの検索結果には売っている作品しか出ないので、
# 買えなくなった作品は検索から消え、1 の走行では詳細を引き直す機会そのものが無い
# (測定は docs/research/dlsite-on-sale-2026-09-23.md)。だから台帳の商品 ID を起点にする。
# 位置づけは docs/decisions/0007-daily-crawl-from-store-feeds.md と
# docs/decisions/0008-no-price-no-availability.md。
# 必要な Secrets は INGEST_URL と INGEST_TOKEN (日次・週次と同じもの)。
on:
  schedule:
    # 毎月 1 日 18:10 UTC = 2 日 03:10 JST。日次 (04:10 UTC) とも週次 (月曜 20:20 UTC) とも
    # 重ならない時刻にする。月 1 回なので時刻の精度は要らない
    - cron: "10 18 1 * *"
  workflow_dispatch:
    inputs:
      store:
        description: "対象ストア (空なら 3 ストアすべて)"
        required: false
        type: choice
        options:
          - ""
          - dlsite
          - audible
          - pokedora

# 日次・週次・手動の巡回と同じグループにする。レートリミッタはプロセス内にあるので、
# 2 つの走行が重なると同じホストへの実効間隔が半分になる (crawler/lib/fetch.ts)
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # DLsite だけ人数で分ける。1 ジョブがジョブ時間の上限に収まらないため。
  # 2026-09-23 時点で作品を持つ声優は 1,161 人。検索 1,161 人 × 2 フロア = 2,322 往復 ×
  # 10 秒 = 約 6.5 時間。3 つに割ると 1 つあたり 2 時間強になる。
  # フロアの数と間隔は docs/stores/dlsite.md
  dlsite:
    name: DLsite で作品を引き直す (${{ matrix.shard }})
    if: ${{ inputs.store == '' || inputs.store == 'dlsite' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      # 並べて走らせない。同じホストを 2 つのプロセスから叩くと、
      # プロセス内のレートリミッタが意味を為さなくなる
      max-parallel: 1
      fail-fast: false
      matrix:
        # 人数ではなく声優 ID のハッシュで分ける (crawler/run.ts の shardActors)。
        # ジョブの合間に日次が作品を足すと対象の人数が変わるので、--offset で分けると
        # 境目がずれてどの組にも入らない人が出る
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 引き直し
        # 既知作品の詳細は引き直さない (--no-skip-known を付けない)。
        # 販売終了に気づく役目は後続の delist ジョブが持つ
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          SHARD: ${{ matrix.shard }}
        run: |
          node crawler/run.ts --base-url "$INGEST_URL" \
            --store dlsite --with-works --no-snapshot --shard "$SHARD"

  # 台帳の DLsite 作品を 1 件ずつ引き直し、買えなくなったものを取り下げる。
  # 2026-09-23 時点で 992 件 × 10 秒 = 約 2.8 時間。
  # 上の巡回と同じホストなので、並べずに後ろに置く (needs)
  delist:
    name: DLsite の販売終了を取り下げる
    needs: [dlsite]
    # 引き直しが失敗しても取り下げは走らせる。別のことを見ているので、
    # 片方が落ちたことはもう片方をやらない理由にならない。
    # dlsite ごと対象外のとき (--store audible など) だけ飛ばす
    if: ${{ !cancelled() && needs.dlsite.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 引き直しと取り下げ
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
        run: node crawler/delist.ts --base-url "$INGEST_URL" --no-snapshot

  # DLsite 以外は 1 ジョブに収まる。取り下げを読めるのは DLsite だけなので
  # (docs/stores/ の各ファイル)、作品の引き直しだけを行う
  others:
    name: ${{ matrix.store }} を引き直す
    if: ${{ inputs.store == '' || inputs.store == 'audible' || inputs.store == 'pokedora' }}
    runs-on: ubuntu-latest
    # 1,161 人 × 1 回 × 6 秒 (Audible) で約 2 時間。ポケドラは辞書に載る人だけなので短い
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        store: [audible, pokedora]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 引き直し
        if: ${{ inputs.store == '' || inputs.store == matrix.store }}
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          STORE: ${{ matrix.store }}
        run: |
          node crawler/run.ts --base-url "$INGEST_URL" \
            --store "$STORE" --with-works --no-snapshot

  notify-failure:
    name: 失敗を Issue に出す
    needs: [dlsite, delist, others]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      # 失敗しても GitHub は黙っているので、人が見る場所に出す
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create crawl-failure --color b60205 --description "日次のクロールが失敗した" --force
          existing="$(gh issue list --label crawl-failure --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "月次の補完巡回が失敗した: $RUN_URL"
          else
            gh issue create \
              --title "月次の補完巡回が失敗した" \
              --label crawl-failure \
              --body "$(printf '%s\n\n%s\n' "走行のログ: $RUN_URL" "直ったらこの Issue を閉じる。閉じないと次の失敗が追記になって気づきにくい。")"
          fi
