<p id="mwJw"><b id="mwKA">山路 和弘</b>（やまじ かずひろ、<a rel="mw:WikiLink" href="https://ja.wikipedia.org/wiki/1954年" title="1954年" id="mwKQ">1954年</a>〈<a rel="mw:WikiLink" href="https://ja.wikipedia.org/wiki/昭和" title="昭和" id="mwKg">昭和</a>29年〉<a rel="mw:WikiLink" href="https://ja.wikipedia.org/wiki/6月4日" title="6月4日" id="mwKw">6月4日</a><sup about="#mwt34" class="mw-ref reference" id="cite_ref-魔進読本42_3-1" rel="dc:references" typeof="mw:Extension/ref" data-mw='{"name":"ref","attrs":{"name":"魔進読本42"},"body":{"id":"mw-reference-text-cite_note-魔進読本42-3"}}'><a href="#cite_note-魔進読本42-3" id="mwLA"><span class="mw-reflink-text" id="mwLQ"><span class="cite-bracket" id="mwLg">[</span>3<span class="cite-bracket" id="mwLw">]</span></span></a></sup> - ）は、<a rel="mw:WikiLink" href="https://ja.wikipedia.org/wiki/日本" title="日本" id="mwQA">日本</a>の<a rel="mw:WikiLink" href="https://ja.wikipedia.org/wiki/俳優" title="俳優" id="mwQQ">俳優</a>、<a rel="mw:WikiLink" href="https://ja.wikipedia.org/wiki/声優" title="声優" id="mwQg">声優</a>、<a rel="mw:WikiLink" href="https://ja.wikipedia.org/wiki/ナレーター" title="ナレーター" class="mw-redirect" id="mwQw">ナレーター</a>。妻は女優、声優の<a rel="mw:WikiLink" href="https://ja.wikipedia.org/wiki/朴璐美" title="朴璐美" id="mwUw">朴璐美</a>。</p>
